name: Deploy Defender XDR Detection

on:
  workflow_dispatch:
    inputs:
      detection_file:
        description: "Bicep detection file to deploy"
        required: true
        default: "detections/defender-xdr/execution/suspicious-encoded-powershell.bicep"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: detection-lab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Static detection validation
        run: python scripts/validate_detection.py

      - name: Update Azure CLI Bicep
        run: az bicep upgrade

      - name: Build selected detection
        run: az bicep build --file "${{ inputs.detection_file }}"

      - name: Deploy selected detection
        shell: bash
        run: |
          DEPLOYMENT_NAME="xdr-detection-${GITHUB_RUN_NUMBER}"

          az deployment group create \
            --resource-group "${{ vars.SECURITY_RESOURCE_GROUP }}" \
            --template-file "${{ inputs.detection_file }}" \
            --name "${DEPLOYMENT_NAME}"
